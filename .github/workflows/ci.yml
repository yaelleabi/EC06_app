name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Quality (Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Recreate .env from .env.dist
        run: cp .env.dist .env

      - name: Run ESLint in Docker
        run: docker compose run --rm app npm run lint

      - name: Run Jest tests in Docker
        run: docker compose run --rm app npm test 2>&1 | tee test-results.log

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.log

      - name: Clean up Docker Compose
        if: always()
        run: docker compose down

  build:
    name: Build Docker Image
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Downcase repository owner and name
        id: repo_name
        run: |
          echo "owner_lowercase=${OWNER,,}" >> $GITHUB_OUTPUT
          echo "repo_lowercase=${REPO,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.owner_lowercase }}/${{ steps.repo_name.outputs.repo_lowercase }}:${{ steps.vars.outputs.sha_short }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/{1}:latest', steps.repo_name.outputs.owner_lowercase, steps.repo_name.outputs.repo_lowercase) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Application
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run deployment script
        run: |
          chmod +x deploy.sh
          ./deploy.sh

      - name: Upload deployment log artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: deploy.log
