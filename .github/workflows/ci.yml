name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Quality (Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Recreate .env from .env.dist
        run: cp .env.dist .env

      - name: Run ESLint in Docker
        run: docker compose run --rm app npm run lint

      - name: Run Jest tests in Docker
        run: docker compose run --rm app npm test 2>&1 | tee test-results.log

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.log

      - name: Clean up Docker Compose
        if: always()
        run: docker compose down

  build:
    name: Build Docker Image
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Downcase repository owner and name
        id: repo_name
        run: |
          echo "owner_lowercase=${OWNER,,}" >> $GITHUB_OUTPUT
          echo "repo_lowercase=${REPO,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Load Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: |
            skillhub-api:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'skillhub-api:${{ steps.vars.outputs.sha_short }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag skillhub-api:${{ steps.vars.outputs.sha_short }} ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.repo_name.outputs.repo_lowercase }}:${{ steps.vars.outputs.sha_short }}
          docker tag skillhub-api:${{ steps.vars.outputs.sha_short }} ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.repo_name.outputs.repo_lowercase }}:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.repo_name.outputs.repo_lowercase }}:${{ steps.vars.outputs.sha_short }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.repo_name.outputs.repo_lowercase }}:latest

  deploy:
    name: Deploy Application
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run deployment script
        run: |
          chmod +x deploy.sh
          ./deploy.sh

      - name: Upload deployment log artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: deploy.log
